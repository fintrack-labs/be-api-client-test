info:
  name: analyze
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/v1/ocr/analyze"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        path: "{{IMAGE_PATH}}"
      - name: documentType
        type: text
        value: receipt
      - name: locale
        type: text
        value: id-ID
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
